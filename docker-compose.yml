services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nimbo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimbo}
      POSTGRES_DB: ${POSTGRES_DB:-nimbo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nimbo}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Inside Docker the DB host is the service name, not localhost
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nimbo}:${POSTGRES_PASSWORD:-nimbo}@db:5432/${POSTGRES_DB:-nimbo}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app   # hot reload while developing
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
